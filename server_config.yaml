# =============================================================================
# Sub2API 完整优化配置文件
# 生成时间：2026-04-12 15:10 CST
# 包含：连接池优化 + 超时优化 + Redis 缓存 + Gzip 压缩 + Keep-Alive + 上游重试
# =============================================================================

# -----------------------------------------------------------------------------
# 服务器配置
# -----------------------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"
  
  # HTTP/2 优化
  h2c:
    enabled: true
    max_concurrent_streams: 100
    idle_timeout: 75
  
  # Gzip/Brotli 压缩优化
  compression:
    enabled: true
    min_size: 1024
    types:
      - "application/json"
      - "text/plain"
      - "application/stream+json"
      - "application/x-ndjson"
  
  # Keep-Alive 优化
  keepalive:
    enabled: true
    timeout: 65
    requests: 100

# -----------------------------------------------------------------------------
# 数据库配置
# -----------------------------------------------------------------------------
database:
  host: "127.0.0.1"
  port: 5432
  user: "sub2api"
  password: "Cyf990314"
  dbname: "sub2api"
  sslmode: "disable"
  
  # 连接池优化
  max_open_conns: 256
  max_idle_conns: 128
  conn_max_lifetime_minutes: 30
  conn_max_idle_time_minutes: 5

# -----------------------------------------------------------------------------
# Redis 配置
# -----------------------------------------------------------------------------
redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  
  # 连接池优化
  pool_size: 4096
  min_idle_conns: 256

# -----------------------------------------------------------------------------
# 缓存配置（新增：只缓存身份信息，不缓存 AI 内容）
# -----------------------------------------------------------------------------
cache:
  enabled: true
  type: "redis"
  
  # 用户身份缓存（不影响计费）
  user_profile:
    enabled: true
    ttl_seconds: 300  # 5 分钟
  
  # Token 验证缓存（不影响计费）
  token_validation:
    enabled: true
    ttl_seconds: 300  # 5 分钟
  
  # 订阅状态缓存（不影响计费）
  subscription_status:
    enabled: true
    ttl_seconds: 60   # 1 分钟，快速同步
  
  # 配额信息缓存（不影响计费）
  quota_status:
    enabled: true
    ttl_seconds: 60   # 1 分钟，快速同步
  
  # ⚠️ AI 回答内容不缓存（每次计费）
  ai_response:
    enabled: false

# -----------------------------------------------------------------------------
# 网关配置（延迟优化核心）
# -----------------------------------------------------------------------------
gateway:
  # 响应头超时：从默认 600s 降低到 120s
  response_header_timeout: 300
  
  # 连接池优化
  max_idle_conns: 8192
  max_idle_conns_per_host: 4096
  max_conns_per_host: 2048
  idle_conn_timeout_seconds: 60
  
  # 流式响应优化
  stream_data_interval_timeout: 300
  stream_keepalive_interval: 10

# -----------------------------------------------------------------------------
# 调度配置（减少排队等待）
# -----------------------------------------------------------------------------
gateway.scheduling:
  # 粘性会话等待超时：从 120s 降低到 45s
  sticky_session_wait_timeout: 45s
  sticky_session_max_waiting: 3
  
  # 兜底等待超时：从 30s 降低到 20s
  fallback_wait_timeout: 20s
  fallback_max_waiting: 100

# -----------------------------------------------------------------------------
# HTTP 客户端配置
# -----------------------------------------------------------------------------
http_client:
  # TCP 连接超时：从 5s 降低到 3s
  dial_timeout_seconds: 3
  # TLS 握手超时
  tls_handshake_timeout_seconds: 3

# -----------------------------------------------------------------------------
# 上游 API 配置（重试优化，不降级）
# -----------------------------------------------------------------------------
upstream:
  openai:
    # 超时设置
    timeout: 30s
    
    # 重试配置（同一模型，不影响质量）
    retry:
      enabled: true
      max_attempts: 3
      backoff_ms: 1000
      retryable_status_codes:
        - 429  # Rate limit
        - 500  # Server error
        - 502  # Bad gateway
        - 503  # Service unavailable
        - 504  # Gateway timeout
    
    # ⚠️ 不启用模型降级（保证质量）
    fallback:
      enabled: false

# -----------------------------------------------------------------------------
# 默认配置
# -----------------------------------------------------------------------------
default:
  admin_email: "Chance.cheng@aliyun.com"
  admin_password: "Cyf990314"
  user_concurrency: 5
  user_balance: 0
  api_key_prefix: "sk-"
  rate_multiplier: 1.0

# -----------------------------------------------------------------------------
# 安全配置
# -----------------------------------------------------------------------------
security:
  url_allowlist:
    enabled: false
    allow_private_hosts: true
    allow_insecure_http: true
  response_headers:
    enabled: true
  csp:
    enabled: true

# -----------------------------------------------------------------------------
# 更新配置
# -----------------------------------------------------------------------------
update:
  proxy_url: ""
